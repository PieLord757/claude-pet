name: Build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build and self-test
        run: ./build.sh
      - name: Package
        run: ditto -c -k --keepParent ClaudePet.app ClaudePet.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ClaudePet
          path: ClaudePet.zip
